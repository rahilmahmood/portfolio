name: Internship Radar Source Cache

on:
  push:
    branches:
      - agent/internship-radar-source-cache
    paths:
      - 'tools/internship-radar/**'
      - '.github/workflows/internship-radar-source-cache.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/internship-radar/**'
      - '.github/workflows/internship-radar-source-cache.yml'

permissions:
  contents: write

concurrency:
  group: internship-radar-source-cache-validation
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Unit tests
        run: python -m unittest discover -s tools/internship-radar/tests -v
      - name: Fetch and reconcile runner-backed inventories
        id: snapshot
        continue-on-error: true
        run: python tools/internship-radar/runner_snapshot.py
      - name: Probe dedicated repo creation permission
        id: repo_probe
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh repo view rahilmahmood/internship-radar-source-cache >/dev/null 2>&1; then
            echo 'Dedicated repo already exists'
            exit 0
          fi
          gh api -X POST user/repos \
            -f name='internship-radar-source-cache' \
            -F private=true \
            -f description='Machine-readable source cache for engineering internship recruiting waves'
      - name: Report repo probe result
        run: echo "repo_probe_outcome=${{ steps.repo_probe.outcome }}"
      - name: Fail visibly when any runner source failed
        if: steps.snapshot.outcome != 'success'
        run: exit 1
