name: Internship Radar Source Cache

on:
  push:
    branches:
      - agent/internship-radar-source-cache
    paths:
      - 'tools/internship-radar/**'
      - '.github/workflows/internship-radar-source-cache.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/internship-radar/**'
      - '.github/workflows/internship-radar-source-cache.yml'

permissions:
  contents: read

concurrency:
  group: internship-radar-source-cache-validation
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Unit tests
        run: python -m unittest discover -s tools/internship-radar/tests -v
      - name: Verify SpaceX Anduril Figure Blue Origin Apple twice
        run: python tools/internship-radar/verify_sources.py
      - name: Probe multiple Tesla fetch relays twice
        run: python tools/internship-radar/tesla_relay_probe.py
