name: Internship Radar Source Cache

on:
  push:
    branches:
      - agent/internship-radar-source-cache
    paths:
      - 'tools/internship-radar/**'
      - '.github/workflows/internship-radar-source-cache.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/internship-radar/**'
      - '.github/workflows/internship-radar-source-cache.yml'

permissions:
  contents: write

concurrency:
  group: internship-radar-source-cache-validation
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Unit tests
        run: python -m unittest discover -s tools/internship-radar/tests -v
      - name: Inspect Blue Origin Workday facets
        run: |
          python - <<'PY'
          import json,requests
          u='https://blueorigin.wd5.myworkdayjobs.com/wday/cxs/blueorigin/BlueOrigin/jobs'
          r=requests.post(u,json={'appliedFacets':{},'limit':20,'offset':0,'searchText':''},headers={'User-Agent':'Mozilla/5.0','Content-Type':'application/json'},timeout=30)
          print('HTTP',r.status_code)
          d=r.json()
          print('KEYS',list(d))
          print('TOTAL',d.get('total'))
          print('FACETS',json.dumps(d.get('facets'),indent=2)[:30000])
          PY
      - name: Fetch and reconcile runner-backed inventories
        id: snapshot
        continue-on-error: true
        run: python tools/internship-radar/runner_snapshot.py
      - name: Fail visibly when any runner source failed
        if: steps.snapshot.outcome != 'success'
        run: exit 1
