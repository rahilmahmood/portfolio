name: Internship Radar Source Cache

on:
  schedule:
    - cron: '25 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/internship-radar-source-cache
    paths:
      - 'tools/internship-radar/**'
      - '.github/workflows/internship-radar-source-cache.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/internship-radar/**'
      - '.github/workflows/internship-radar-source-cache.yml'

permissions:
  contents: write

concurrency:
  group: internship-radar-source-cache
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Unit tests
        run: python -m unittest discover -s tools/internship-radar/tests -v
      - name: Fetch and reconcile all six inventories
        id: snapshot
        continue-on-error: true
        run: python tools/internship-radar/snapshot.py
      - name: Commit source state
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- internship-radar-state; then
            echo 'No source-state change'
            exit 0
          fi
          git config user.name 'internship-radar-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add internship-radar-state
          git commit -m 'Update internship radar source state'
          git push
      - name: Fail visibly when any source failed
        if: steps.snapshot.outcome != 'success'
        run: exit 1
